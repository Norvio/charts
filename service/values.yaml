image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2
containerPort: 8080
env: {}

service:
  enabled: true
  port: 80

probes:
  enabled: true
  liveness:
    path: /healthz
  readiness:
    path: /readyz

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  annotations: {}

podAnnotations: {}